[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transmymodels"
version = "0.1.0"
description = "Import multiple OpenAI-compatible upstreams behind one local OpenAI endpoint."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
transmymodels = "transmymodels.cli:main"

[tool.setuptools.packages.find]
include = ["transmymodels*"]
